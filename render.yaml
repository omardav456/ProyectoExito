# Render Blueprint — ÉXITO STOCK AI
# Despliegue: backend (Docker, Java 25) + frontend (static, Vite/React)
#
# NOTA: los servicios actuales del dashboard se crearon manualmente y no se
# reconfiguran solos desde este archivo. Este blueprint documenta la
# configuración (incluida la regla SPA del frontend) y sirve para recrear
# los servicios desde Render Blueprint si hiciera falta.
#
# Variables con `sync: false` deben completarse en el Dashboard de Render
# después del primer deploy (ver docs/DEPLOY_RENDER.md de la 1era entrega).

services:
  # ----------------------- BACKEND (Spring Boot, Docker) -----------------------
  - type: web
    name: backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:postgresql://<host-pooler-supabase>:5432/postgres?sslmode=disable
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # postgres.bkytofqaqxkoipattnkj
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # contraseña de la base de datos
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false # https://proyectoexito.onrender.com,http://localhost:5173
      - key: APP_JWT_SECRET
        sync: false # secreto aleatorio de al menos 32 caracteres
      - key: APP_JWT_EXPIRATION_MS
        value: 28800000

  # -------------------- FRONTEND (Vite + React, static) ------------------------
  - type: web
    name: frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # https://backend-1np1.onrender.com/api
    routes:
      # SPA catch-all: sirve index.html para cualquier ruta (refresh/navegación directa)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable